services:
  crm-api:
    build:
      context: .
      dockerfile: docker/crm-api/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8020}:${PORT:-8020}"
    environment:
      PORT: ${PORT:-8020}
      DB_PATH: /data/mock_salesforce.db
    volumes:
      - mock_salesforce_db:/data
    # mcp-server waits on `service_healthy`, and a service with no healthcheck never reaches
    # that condition: it sat in `created` and never started. Same probe the other mocks use.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT', '8020') + '/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile
    ports:
      - "127.0.0.1:${MCP_PORT:-8021}:${MCP_PORT:-8021}"
    environment:
      # Same PORT convention as crm-api, but a separate host-level override
      # variable (MCP_PORT) so remapping one service's published port never
      # collides with the other's.
      PORT: ${MCP_PORT:-8021}
      API_BASE_URL: http://crm-api:${PORT:-8020}
    depends_on:
      crm-api:
        condition: service_healthy

volumes:
  mock_salesforce_db:
